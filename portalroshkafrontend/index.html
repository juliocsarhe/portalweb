  <body>
    <div id="root"></div>

    <!-- SCRIPT SEGURO – DEBE IR EN BODY -->
    <script>
      (function () {
        // Protección total
        if (!window.matchMedia) return;

        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const link = document.getElementById('favicon');

        if (!link) return;

        function setFavicon(e) {
          const matches =
            e && typeof e.matches === 'boolean'
              ? e.matches
              : mq.matches;

          link.href = matches ? '/roshkaw.svg' : '/roshkab.svg';
        }

        // Inicial
        setFavicon(mq);

        // Listener compatible (nuevo + legacy)
        if (typeof mq.addEventListener === 'function') {
          mq.addEventListener('change', setFavicon);
        } else if (typeof mq.addListener === 'function') {
          mq.addListener(setFavicon);
        }

        // Dark mode manual
        const saved = localStorage.getItem('darkMode');
        if (saved === 'true') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Entrada de React -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
